<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keuanganku</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Skrip Redirect Langsung ke Web App Google Apps Script -->
    <script>
        // Redirect otomatis ke aplikasi utama Anda
        window.location.replace("https://script.google.com/macros/s/AKfycbxw-Cp6jH0XsNwdM_AOUaU6zZ27ieUKAyQgeVc1ucrwQMymutRyj680Vi5Lwp9ZORLeTg/exec");
    </script>
</head>
<body style="background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding-top: 50px;">
    <p>Memuat Keuanganku...</p>

    <!-- Pendaftaran Service Worker PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('Service Worker terdaftar:', reg.scope))
            .catch((err) => console.log('Pendaftaran Service Worker gagal:', err));
        });
      }
    </script>
</body>
</html>
